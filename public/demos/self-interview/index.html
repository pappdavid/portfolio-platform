<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Papp — Self Interview</title>
  <meta name="description" content="A portfolio site that interviews itself for recruiters." />
  <script type="module" crossorigin src="/demos/self-interview/assets/index-6y3xTtqf.js"></script>
  <link rel="stylesheet" crossorigin href="/demos/self-interview/assets/index-BsutWFKS.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Hi — I'm David's site. Ask me anything about him.</h1>
      <p>I'll interview myself; feel free to jump in.</p>
      <button id="clear-conversation" class="clear-conversation" type="button">Clear conversation and restart</button>
    </header>
    <main id="chat" class="chat" aria-live="polite"></main>
    <div id="chips" class="chips"></div>
    <form id="composer-form" class="composer">
      <input id="composer-input" type="text" maxlength="280" placeholder="Ask a question…" autocomplete="off" aria-label="Ask a question" />
      <button type="submit">Ask</button>
    </form>
    <a class="contact-link" href="mailto:contact@davidpapp.dev">Ask David directly · contact@davidpapp.dev</a>
  </div>
</body>
</html>
